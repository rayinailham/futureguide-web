    <!-- Structured data: FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Apa bedanya FutureGuide dengan kuis kepribadian biasa di internet?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Kuis populer di internet sebagian besar opini tanpa basis ilmiah. FutureGuide pakai tiga instrumen psikometri tervalidasi lintas budaya — RIASEC, OCEAN, dan VIA-IS — dengan total 200 item. Setiap interpretasi ditambatkan ke 121 jurnal akademis, jadi bisa ditelusuri ke risetnya."
            }
          },
          {
            "@type": "Question",
            "name": "Berapa lama waktu untuk menyelesaikan assessment?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Rata-rata 35 sampai 55 menit. Tidak ada timer, jadi kamu bisa berhenti dan lanjut. Yang penting jawab dengan jujur."
            }
          },
          {
            "@type": "Question",
            "name": "Apakah hasilnya akurat untuk pelajar SMA atau anak SMP?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Instrumennya didesain untuk usia 14 tahun ke atas. Untuk pelajar SMA dan mahasiswa, hasilnya sangat relevan untuk pemilihan jurusan dan eksplorasi karier. Untuk anak SMP awal, sebaiknya jadi bahan diskusi dengan guru BK atau orang tua."
            }
          },
          {
            "@type": "Question",
            "name": "Apakah bisa retake atau ulang assessment-nya?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Bisa. Setiap token = 1 sesi assessment lengkap. Banyak pengguna mengulang setelah 6 sampai 12 bulan untuk melihat perkembangan profilnya."
            }
          },
          {
            "@type": "Question",
            "name": "Data jawabanku aman? Bagaimana privasi laporan?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Jawabanmu hanya digunakan untuk menghasilkan laporanmu sendiri. Laporan tidak dibagikan ke pihak ketiga. Kamu yang memutuskan apakah membagikan share link ke orang tua, guru BK, atau teman."
            }
          },
          {
            "@type": "Question",
            "name": "Bagaimana cara membayar dan apakah token bisa hangus?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Pembayaran via QRIS — bisa pakai DANA, GoPay, OVO, ShopeePay, atau mobile banking. Token tidak ada masa kedaluwarsa."
            }
          },
          {
            "@type": "Question",
            "name": "Hasilnya bisa di-print atau di-PDF?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Bisa. Setiap laporan punya tombol export PDF dan share link publik. PDF cocok untuk dilampirkan ke portofolio kuliah, share link cocok untuk diskusi cepat dengan konselor."
            }
          }
        ]
      }
